server {
  listen 80;
  root /usr/share/nginx/html;

  # The iframe is embedded by other sites: never let it be framed by anything but
  # the apps' pages (enforced by the iframe itself via allowed origins), never cache HTML.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /health { access_log off; return 200 "ok"; }

  location ~* \.(js|css|wasm|png|svg|woff2?)$ {
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (TanStack Router): serve index.html.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
