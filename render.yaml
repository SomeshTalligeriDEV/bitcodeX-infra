# Render blueprint for BitcodeX on Bittensor testnet (bitcodex-docs/DEPLOY_RENDER.md).
# Images come from private GHCR packages (registry credential named "ghcr", created in
# the Render dashboard; DEPLOY_RENDER.md step 1). Images come from GHCR, built by .github/workflows/images.yml (Render does not build
# the Rust addons). Secrets are generated by Render or entered in the dashboard; none
# are in this file.

envVarGroups:
  - name: bitcodex-shared
    envVars:
      # API ↔ key share node telemetry password; must match on all three services.
      - key: KS_NODE_REPORT_PASSWORD
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: bitcodex-db
    plan: free
    databaseName: bitcodex
    postgresMajorVersion: "17"

services:
  - type: web
    name: bitcodex-api
    runtime: image
    plan: free
    image:
      url: ghcr.io/someshtalligeridev/bitcodex-api:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    healthCheckPath: /
    envVars:
      - fromGroup: bitcodex-shared
      - key: SERVER_PORT
        value: "4200"
      - key: DB_HOST
        fromDatabase: { name: bitcodex-db, property: host }
      - key: DB_USER
        fromDatabase: { name: bitcodex-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: bitcodex-db, property: password }
      - key: DB_NAME
        fromDatabase: { name: bitcodex-db, property: database }
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      # Ed25519 PEM, base64 (see DEPLOY_RENDER.md). Signs app access tokens.
      - key: BITCODEX_ACCESS_TOKEN_KEY
        sync: false
      - key: BITCODEX_ACCESS_TOKEN_ISSUER
        value: bitcodex
      - key: BITCODEX_SIGNUP_ENABLED
        value: "true"

  - type: web
    name: bitcodex-ksn1
    runtime: image
    plan: free
    image:
      url: ghcr.io/someshtalligeridev/bitcodex-ksn:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    dockerCommand: corepack yarn start
    healthCheckPath: /
    envVars:
      - fromGroup: bitcodex-shared
      - key: PORT
        value: "4201"
      - key: DB_HOST
        fromDatabase: { name: bitcodex-db, property: host }
      - key: DB_USER
        fromDatabase: { name: bitcodex-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: bitcodex-db, property: password }
      - key: DB_NAME
        value: bitcodex_ksn1
      - key: DB_SSL
        value: "false"
      # Secret file added in the dashboard (DEPLOY_RENDER.md step 4).
      - key: ENCRYPTION_SECRET_PATH
        value: /etc/secrets/ksn_encryption_secret.txt
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BITCODEX_API_BASE_URL
        sync: false

  - type: web
    name: bitcodex-ksn2
    runtime: image
    plan: free
    image:
      url: ghcr.io/someshtalligeridev/bitcodex-ksn:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    dockerCommand: corepack yarn start_2
    healthCheckPath: /
    envVars:
      - fromGroup: bitcodex-shared
      - key: PORT
        value: "4202"
      - key: DB_HOST
        fromDatabase: { name: bitcodex-db, property: host }
      - key: DB_USER
        fromDatabase: { name: bitcodex-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: bitcodex-db, property: password }
      - key: DB_NAME
        value: bitcodex_ksn2
      - key: DB_SSL
        value: "false"
      - key: ENCRYPTION_SECRET_PATH
        value: /etc/secrets/ksn_encryption_secret.txt
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: BITCODEX_API_BASE_URL
        sync: false

# The wallet iframe is added after the first deploy (DEPLOY_RENDER.md step 6): its
# image bakes in the API URL, so it cannot be built before the API has an address.
